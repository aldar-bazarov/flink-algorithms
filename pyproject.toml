[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["algorithms"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", ".local_build", "__pycache__"]

[tool.ruff.lint]
# Проверки, максимально близкие к ошибкам компиляции:
# синтаксис, неизвестные имена и некорректные конструкции.
select = ["E9", "F63", "F7", "F82"]
